# VMware ESXi Kickstart Configuration
# Author: [Your Name]
# Date: [Date]
# Description: Automated ESXi installation with security hardening

# -------------------------
# Installation Configuration
# -------------------------
vmaccepteula
rootpw --iscrypted $1$rkH/n0Aw$w1BC4WjBK940LWIqraJ4/  # Encrypted password

# Disk Configuration
install --firstdisk=hpsa,ata_piix,nhpsa,local --overwritevmfs
clearpart --firstdisk=hpsa,ata_piix,nhpsa,local --overwritevmfs

# Network Configuration
network --hostname=test --bootproto=static --device=vmnic0 \
  --ip=192.168.34.100 --netmask=255.255.255.0 \
  --gateway=192.168.34.1 --nameserver=192.168.34.11

reboot

# ------------------
# First Boot Script
# ------------------
%firstboot --interpreter=busybox

# System Identification
echo "> Configuring System Settings..."
esxcli system hostname set --fqdn=test

# DNS Configuration
esxcli network ip dns search add --domain=test.com
esxcli network ip dns server add --server=192.168.34.11
esxcli network ip dns server add --server=192.168.34.12

# NTP Configuration
cat > /etc/ntp.conf << 'NTP_EOF'
restrict default kod nomodify notrap nopeer
restrict 127.0.0.1
server 192.168.34.11
server 192.168.34.12
driftfile /etc/ntp.drift
NTP_EOF

/etc/init.d/ntpd start

# Security Hardening
echo "> Applying Security Settings..."
esxcli system settings kernel set -s ipmiEnabled -v False  # Disable IPMI
esxcli system coredump partition set -e true               # Enable core dumps

# SNMP Configuration
esxcli system snmp set -c public -p 161 \
  -t 192.168.34.200@162/public -e yes

# MOTD Banner Configuration
cat > /etc/motd << 'MOTD_EOF'
You have activated Tech Support Mode.
The time and date of this activation have been sent to the system logs.

You are authorized to use this System for approved Tech Support purposes only. 
Use for any other purpose is prohibited. All transactional records, reports, 
e-mail, software, and other data generated by or residing upon this System 
are the property of the Company and may be used by the Company for any purpose. 
Authorized and unauthorized activities will be monitored.
MOTD_EOF

# Web Interface Hardening
cat > /etc/rc.local.d/local.sh << 'WEB_EOF'
#!/bin/sh
# Disable unnecessary web services
services=(
  "/folder"
  "/mob" 
  "/screen"
  "/cgi-bin"
  "/mobfdn"
)

for service in "${services[@]}"; do
  vim-cmd proxysvc/remove_service "$service" "httpsWithRedirect"
done

/sbin/services.sh restart
exit 0
WEB_EOF

chmod +x /etc/rc.local.d/local.sh

echo "> Configuration Complete!"